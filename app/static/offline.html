<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离线 · 墨痕</title>
<!-- 离线兜底页：必须完全自包含（断网时外部 CSS/JS 都拿不到），
     所以样式内联、不引任何外部资源。其余页面由 Service Worker 从缓存回放。 -->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; background: #FAF6EF; color: #2E2A26;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .card { max-width: 420px; text-align: center; }
  .mark {
    width: 44px; height: 44px; border-radius: 12px; background: #B5533C; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center; color: #FAF6EF;
    font: 700 20px/1 Georgia, "Noto Serif SC", serif;
  }
  h1 { font-size: 18px; font-weight: 600; margin: 0 0 10px; }
  p { margin: 0 0 8px; color: #5C5348; font-size: 14px; }
  a { color: #B5533C; text-decoration: none; border-bottom: 1px solid currentColor; }
  .hint { margin-top: 18px; font-size: 13px; color: #8B8073; }
  @media (prefers-color-scheme: dark) {
    body { background: #1F1B17; color: #EDE4D6; }
    p { color: #C6B9A6; }
    .hint { color: #9A8D7C; }
    a { color: #D98872; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">墨</div>
    <h1>现在处于离线状态</h1>
    <p>这个页面还没被缓存过，联网后刷新即可。</p>
    <p>已经读过并缓存的文章，离线也能照常打开。</p>
    <p class="hint"><a href="/">回到首页</a> · 编辑器里的改动会在联网后继续保存</p>
  </div>
</body>
</html>
